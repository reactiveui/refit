name: Build

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

# Needed so the reusable workflow can optionally delete the temp per-OS artifacts it creates.
permissions:
    contents: read
    actions: write

jobs:
    build:
        uses: reactiveui/actions-common/.github/workflows/workflow-common-setup-and-build.yml@main
        with:
            srcFolder: src
            minverMinimumMajorMinor: '10.2'
            # The MSTest, NUnit and xUnit documentation examples still build, but their hosts reject the TUnit-only
            # detailed-logging switches, so the coverage run takes the test suites and the TUnit example.
            testProjects: |
                tests/**/*.csproj
                examples/Documentation/TestingFrameworks/TUnit/*.csproj
        secrets:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
